name = "mu-physics-project"
pages_build_output_dir = "."
compatibility_date = "2026-11-19"

[[d1_databases]]
binding = "DB"
database_name = "mu-physics-accounts"
database_id = "SET_AFTER_CREATING_D1"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "FAN_COORDINATOR"
class_name = "FanControlCoordinator"
# This is a Durable Object binding to the separately deployed coordinator Worker,
# not a Service Binding. Deploy coordinator/wrangler.toml before deploying Pages.
script_name = "mu-physics-fan-coordinator"

# Keep the Pages binding's script_name and class_name aligned with
# coordinator/wrangler.toml. See DEPLOYMENT.md for the required deployment order.
